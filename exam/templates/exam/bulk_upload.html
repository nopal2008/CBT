<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Upload Questions - CBT System</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .upload-area:hover {
            border-color: #10b981 !important;
        }
    </style>
</head>

<body class="bg-gray-100">

    <!-- PAGE WRAPPER -->
    <div class="max-w-5xl mx-auto py-12 px-6">

        <!-- HEADER -->
        <div class="mb-10">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <i class="fas fa-cloud-upload-alt text-green-600"></i>
                Bulk Upload Questions
            </h1>
            <p class="text-gray-500 mt-1">Unggah file CSV untuk menambahkan soal ke dalam sistem.</p>
        </div>

        <!-- CONTENT CARD -->
        <div class="bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

            <form method="post" enctype="multipart/form-data" id="uploadForm">
                {% csrf_token %}

                <!-- FILE INPUT -->
                <div class="mb-10">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">1. Upload CSV File</h2>

                    <label for="csv_file" class="block">
                        <div class="upload-area w-full p-8 border-2 border-dashed border-gray-300 rounded-xl
                                    text-center cursor-pointer transition duration-200 bg-gray-50">
                            <i class="fas fa-file-csv text-green-600 text-4xl mb-3"></i>
                            <p class="text-gray-700 font-medium">Klik untuk memilih file CSV</p>
                            <p class="text-gray-500 text-sm">Atau seret file ke area ini</p>
                        </div>
                    </label>

                    <input 
                        type="file"
                        name="csv_file"
                        id="csv_file"
                        accept=".csv"
                        class="hidden"
                        onchange="validateForm()"
                    >

                    <p class="text-sm text-gray-500 mt-3">
                        Gunakan template resmi.  
                        <a href="{% url 'exam:download_question_bank_template' %}"
                           class="text-green-600 font-semibold hover:underline">
                            Download template
                        </a>
                    </p>
                </div>

                <!-- SELECT EXAM -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">2. Pilih Exam</h2>

                    <select 
                        name="exam_id" 
                        id="exam_id"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300
                               focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        onchange="validateForm()"
                    >
                        <option value="">-- Pilih Exam --</option>
                        {% for exam in exams %}
                        <option value="{{ exam.id }}">{{ exam.title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- OPTIONAL BANK -->
                <div class="mb-10">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">3. (Opsional) Pilih Question Bank</h2>

                    <select 
                        name="question_bank_id"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300
                               focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    >
                        <option value="">-- Pilih Question Bank (Opsional) --</option>
                        {% for bank in question_banks %}
                        <option value="{{ bank.id }}">{{ bank.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="flex justify-between items-center border-t pt-6">
                    <a href="{% url 'exam:teacher_questions' %}" 
                       class="bg-gray-500 text-white px-6 py-3 rounded-lg font-semibold
                              hover:bg-gray-600 transition duration-200">
                        <i class="fas fa-arrow-left mr-2"></i>Kembali
                    </a>

                    <button 
                        type="submit"
                        id="uploadBtn"
                        disabled
                        class="bg-gray-400 text-white px-6 py-3 rounded-lg cursor-not-allowed
                               transition duration-200 font-semibold flex items-center"
                    >
                        <i class="fas fa-upload mr-2"></i>Upload Questions
                    </button>
                </div>

            </form>
        </div>
    </div>

<script>
function validateForm() {
    const fileInput = document.getElementById('csv_file');
    const examSelect = document.getElementById('exam_id');
    const uploadBtn = document.getElementById('uploadBtn');

    const isFileSelected = fileInput.files.length > 0;
    const isExamSelected = examSelect.value !== "";

    if (isFileSelected && isExamSelected) {
        uploadBtn.disabled = false;
        uploadBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
        uploadBtn.classList.add('bg-green-600', 'hover:bg-green-700');
    } else {
        uploadBtn.disabled = true;
        uploadBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
        uploadBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
    }
}

document.getElementById('uploadForm').addEventListener('submit', function(e) {
    const fileInput = document.getElementById('csv_file');
    const examSelect = document.getElementById('exam_id');

    if (!fileInput.files.length || !examSelect.value) {
        e.preventDefault();
        alert('Harap lengkapi file dan exam.');
        return;
    }

    const uploadBtn = document.getElementById('uploadBtn');
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Uploading...';
    uploadBtn.disabled = true;
});
</script>

</body>
</html>
